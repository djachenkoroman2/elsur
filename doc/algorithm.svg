  <style
     id="style1">
    .term { fill:#d9ead3; stroke:#38761d; }
    .proc { fill:#cfe2f3; stroke:#1155cc; }
    .io   { fill:#fce5cd; stroke:#b45f06; }
    .dec  { fill:#fff2cc; stroke:#bf9000; }
    .box  { stroke-width:1.5; rx:10; }
    .txt  { font-size:14px; fill:#111; }
    .sm   { font-size:12px; fill:#111; }
    .edge { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .lbl  { font-size:12px; fill:#333; }
  </style>
  <text
     x="380"
     y="28"
     text-anchor="middle"
     class="txt"
     font-weight="bold"
     id="text1">Алгоритм работы</text>
  <!-- Терминатор: старт -->
  <rect
     x="300"
     y="45"
     width="160"
     height="40"
     class="box term"
     id="rect1" />
  <text
     x="380"
     y="70"
     text-anchor="middle"
     class="txt"
     id="text2">Начало</text>
  <path
     class="edge"
     d="M380,85 L380,110"
     id="path2" />
  <!-- Ввод -->
  <rect
     x="210"
     y="110"
     width="340"
     height="60"
     class="box io"
     id="rect2" />
  <text
     x="380"
     y="134"
     text-anchor="middle"
     class="txt"
     id="text3">Ввод исходных данных:</text>
  <text
     x="380"
     y="152"
     text-anchor="middle"
     class="sm"
     id="text4">λᵢ⁽⁰⁾, {dⱼ, λⱼ, pᵢⱼ}, μ, T</text>
  <text
     x="380"
     y="166"
     text-anchor="middle"
     class="sm"
     id="text5" />
  <path
     class="edge"
     d="M380,170 L380,195"
     id="path5" />
  <!-- Валидация -->
  <rect
     x="230"
     y="195"
     width="300"
     height="45"
     class="box proc"
     id="rect5" />
  <text
     x="380"
     y="214"
     text-anchor="middle"
     class="txt"
     id="text6">Валидация данных:</text>
  <text
     x="380"
     y="230"
     text-anchor="middle"
     class="sm"
     id="text7">λ≥0, p∈[0;1], T&gt;0</text>
  <!-- Ветка ошибки -->
  <path
     class="edge"
     d="m 111.98568,223.15918 -0.32974,-87.13284 c 30.62229,-0.72117 82.38896,0.53445 96.90709,0.36359"
     id="path7"
     sodipodi:nodetypes="ccc" />
  <text
     x="128"
     y="185"
     class="lbl"
     id="text8">ошибка</text>
  <path
     class="edge"
     d="M380,240 L380,265"
     id="path9" />
  <!-- Λ -->
  <rect
     x="190"
     y="265"
     width="380"
     height="45"
     class="box proc"
     id="rect9" />
  <text
     x="380"
     y="293"
     text-anchor="middle"
     class="txt"
     id="text9">Λᵢ = λᵢ⁽⁰⁾ + Σ λⱼ · pᵢⱼ</text>
  <path
     class="edge"
     d="M380,310 L380,335"
     id="path10" />
  <!-- Решение: mu > 0 -->
  <polygon
     points="380,335 505,385 380,435 255,385"
     class="box dec"
     id="polygon10" />
  <text
     x="380"
     y="390"
     text-anchor="middle"
     class="txt"
     id="text10">μ &gt; 0 ?</text>
  <!-- Ветка нет -->
  <path
     class="edge"
     d="M255,385 L110,385"
     id="path11" />
  <rect
     x="10"
     y="360"
     width="200"
     height="50"
     class="box proc"
     id="rect11" />
  <text
     x="110"
     y="381"
     text-anchor="middle"
     class="sm"
     id="text11">Qᵢ = exp(−Λᵢ·T)</text>
  <text
     x="110"
     y="398"
     text-anchor="middle"
     class="sm"
     id="text12">K = 0</text>
  <text
     x="225"
     y="378"
     class="lbl"
     id="text13">нет</text>
  <!-- Ветка да -->
  <path
     class="edge"
     d="M380,435 L380,460"
     id="path13" />
  <text
     x="392"
     y="452"
     class="lbl"
     id="text14">да</text>
  <rect
     x="200"
     y="460"
     width="360"
     height="65"
     class="box proc"
     id="rect14" />
  <text
     x="380"
     y="484"
     text-anchor="middle"
     class="sm"
     id="text15">Qᵢ = μ/(Λᵢ+μ) + Λᵢ·exp(−(Λᵢ+μ)·T)/(Λᵢ+μ)</text>
  <text
     x="380"
     y="504"
     text-anchor="middle"
     class="sm"
     id="text16">K = μ/(Λᵢ+μ)</text>
  <!-- Слияние -->
  <path
     class="edge"
     d="m 110.05466,409.24843 v 174.35859 h 89.92558"
     id="path16" />
  <path
     class="edge"
     d="M380,525 L380,560"
     id="path17" />
  <circle
     cx="320"
     cy="560"
     r="3"
     fill="#333"
     id="circle17" />
  <!-- Вклады -->
  <rect
     x="200"
     y="560"
     width="360"
     height="45"
     class="box proc"
     id="rect17" />
  <text
     x="380"
     y="578"
     text-anchor="middle"
     class="txt"
     id="text17">sⱼ = λⱼ·pᵢⱼ / Λᵢ</text>
  <text
     x="380"
     y="594"
     text-anchor="middle"
     class="sm"
     id="text18">вклады источников ущерба</text>
  <path
     class="edge"
     d="M380,605 L380,630"
     id="path18" />
  <!-- Вывод -->
  <rect
     x="200"
     y="630"
     width="360"
     height="55"
     class="box io"
     id="rect18" />
  <text
     x="380"
     y="652"
     text-anchor="middle"
     class="txt"
     id="text19">Вывод в консоль:</text>
  <text
     x="380"
     y="670"
     text-anchor="middle"
     class="sm"
     id="text20">Λᵢ, Qᵢ, K, таблица вкладов</text>
  <path
     class="edge"
     d="M380,685 L380,710"
     id="path20" />
  <!-- Решение: сохранить? -->
  <polygon
     points="380,710 510,755 380,800 250,755"
     class="box dec"
     id="polygon20" />
  <text
     x="380"
     y="751"
     text-anchor="middle"
     class="txt"
     id="text21">выход?</text>
  <text
     x="380"
     y="768"
     text-anchor="middle"
     class="sm"
     id="text22">задан файл</text>
  <path
     class="edge"
     d="M510,755 L610,755"
     id="path22" />
  <text
     x="525"
     y="748"
     class="lbl"
     id="text23">да</text>
  <rect
     x="610"
     y="728"
     width="140"
     height="55"
     class="box io"
     id="rect23" />
  <text
     x="680"
     y="750"
     text-anchor="middle"
     class="sm"
     id="text24">Сохранить</text>
  <text
     x="680"
     y="766"
     text-anchor="middle"
     class="sm"
     id="text25">CSV / JSON</text>
  <path
     class="edge"
     d="m 680,783 0.85106,109.08511 -214.89361,0.89361"
     id="path25"
     sodipodi:nodetypes="ccc" />
  <path
     class="edge"
     d="M380,800 L380,870"
     id="path26" />
  <text
     x="392"
     y="820"
     class="lbl"
     id="text26">нет</text>
  <!-- Терминатор: конец -->
  <rect
     x="300"
     y="870"
     width="160"
     height="40"
     class="box term"
     id="rect26" />
  <text
     x="380"
     y="895"
     text-anchor="middle"
     class="txt"
     id="text27">Конец</text>
  <!-- Легенда -->
  <rect
     x="120"
     y="940"
     width="14"
     height="14"
     class="box term"
     id="rect27" />
  <text
     x="140"
     y="952"
     class="sm"
     id="text28">начало/конец</text>
  <rect
     x="250"
     y="940"
     width="14"
     height="14"
     class="box io"
     id="rect28" />
  <text
     x="270"
     y="952"
     class="sm"
     id="text29">ввод/вывод</text>
  <rect
     x="360"
     y="940"
     width="14"
     height="14"
     class="box proc"
     id="rect29" />
  <text
     x="380"
     y="952"
     class="sm"
     id="text30">расчёт</text>
  <rect
     x="450"
     y="940"
     width="14"
     height="14"
     class="box dec"
     id="rect30" />
  <text
     x="470"
     y="952"
     class="sm"
     id="text31">решение</text>
  <text
     xml:space="preserve"
     id="text33"
     style="fill:#000000;text-orientation:auto;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect33)" />
  <text
     xml:space="preserve"
     style="writing-mode:lr-tb;direction:ltr;fill:#000000"
     x="197.23766"
     y="238.15958"
     id="text34"><tspan
       sodipodi:role="line"
       id="tspan34" /></text>
